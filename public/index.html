<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace: Chat & Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Header Utama -->
        <header class="app-header">
            <div class="header-brand">
                <div class="avatar-badge" aria-hidden="true">AI</div>
                <div>
                    <h1 class="app-title">Chatbot AI Workspace</h1>
                    <div class="status-indicator">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span class="status-text">Online (Siap)</span>
                    </div>
                </div>
            </div>

            <!-- Kontrol Aksi Header -->
            <div class="header-actions">
                <div class="control-group">
                    <label for="model-select" class="control-label">Model AI:</label>
                    <select id="model-select" class="select-input" aria-label="Pilih Model AI">
                        <option value="baidu/ernie-5.5-flash-preview:free">Ernie 5.5 Flash (Cepat & Akurat)</option>
                        <option value="nvidia/nemotron-3.5-lightning:free">Nemotron 3.5 Lightning</option>
                        <option value="inclusionai/ling-3.2-flash:free">Ling 3.2 Flash (Reasoning)</option>
                        <option value="liquid/lfm-3-1.7b:free">Liquid LFM 1.7B</option>
                    </select>
                </div>

                <button type="button" id="clear-chat" class="btn-ghost" title="Bersihkan riwayat percakapan" aria-label="Bersihkan obrolan">
                    Bersihkan
                </button>

                <button type="button" id="theme-toggle" class="btn-theme" title="Beralih tema terang/gelap" aria-label="Ganti mode tampilan">
                    <span id="theme-icon" aria-hidden="true">☀️</span>
                </button>
            </div>
        </header>

        <!-- Navigasi Tab Mobile -->
        <nav class="mobile-tab-nav" aria-label="Navigasi Tampilan Layar Kecil">
            <button type="button" class="tab-btn active" data-target="panel-chat" aria-selected="true">
                Obrolan
            </button>
            <button type="button" class="tab-btn" data-target="panel-notes" aria-selected="false">
                Catatan & Kode
            </button>
        </nav>

        <!-- Kontainer Split Workspace -->
        <main class="workspace-container">
            <!-- Kolom Kiri: Chat -->
            <section id="panel-chat" class="workspace-column chat-column" aria-label="Panel Percakapan AI">
                <div id="chat-box" class="chat-box" role="log" aria-label="Riwayat percakapan" aria-live="polite">
                    <div class="message bot">
                        <div class="message-meta">
                            <span class="sender-name">Asisten AI</span>
                        </div>
                        <div class="message-content">
                            Halo! Saya asisten AI Anda di workspace ini. Anda dapat bertanya, meminta bantuan coding, atau menulis catatan langsung di panel sebelah kanan.
                        </div>
                    </div>

                    <!-- Prompt Starter Chips -->
                    <div id="starter-chips" class="starter-chips" aria-label="Saran Pertanyaan">
                        <p class="chips-title">Mulai dengan topik cepat:</p>
                        <div class="chips-grid">
                            <button type="button" class="chip-item" data-prompt="Jelaskan konsep RESTful API dan metode HTTP utamanya.">
                                💡 Konsep RESTful API
                            </button>
                            <button type="button" class="chip-item" data-prompt="Buat contoh route Express.js sederhana untuk operasi CRUD data produk.">
                                ⚡ Contoh CRUD Express.js
                            </button>
                            <button type="button" class="chip-item" data-prompt="Apa perbedaan Server-Sent Events (SSE) dengan WebSocket?">
                                🔄 Perbedaan SSE vs WebSocket
                            </button>
                            <button type="button" class="chip-item" data-prompt="Bantu jelaskan cara kerja middleware pada Express framework.">
                                🛡️ Cara Kerja Middleware
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Form Input Chat -->
                <form id="chat-form" class="chat-form" aria-label="Kirim Pesan">
                    <label for="user-input" class="sr-only">Tulis pertanyaan atau instruksi Anda</label>
                    <textarea 
                        id="user-input" 
                        placeholder="Tulis pesan... (Enter untuk kirim, Shift+Enter untuk baris baru)" 
                        rows="1"
                        required 
                        aria-required="true"
                    ></textarea>
                    <button type="submit" id="submit-btn" class="btn-primary" aria-label="Kirim pesan">
                        <span>Kirim</span>
                    </button>
                </form>
            </section>

            <!-- Kolom Kanan: Catatan & Cuplikan Kode -->
            <aside id="panel-notes" class="workspace-column notes-column" aria-label="Panel Catatan & Kode">
                <div class="notes-header">
                    <div>
                        <h2 class="notes-title">Catatan Workspace</h2>
                        <span id="notes-counter" class="notes-meta">0 karakter</span>
                    </div>
                    <div class="notes-actions">
                        <button type="button" id="copy-notes-btn" class="btn-small" title="Salin semua catatan ke clipboard">
                            Salin
                        </button>
                        <button type="button" id="clear-notes-btn" class="btn-small btn-small-danger" title="Kosongkan catatan">
                            Hapus
                        </button>
                    </div>
                </div>

                <div class="notes-body">
                    <label for="notes-textarea" class="sr-only">Area Catatan Workspace</label>
                    <textarea 
                        id="notes-textarea" 
                        class="notes-textarea" 
                        placeholder="Gunakan area ini untuk menyimpan cuplikan kode, ringkasan jawaban, atau catatan kuliah/kerja Anda..."
                        spellcheck="false"
                    ></textarea>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
